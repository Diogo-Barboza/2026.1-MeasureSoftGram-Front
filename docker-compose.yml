services:
  front:
    container_name: front
    image: measuresoftgram-front:latest
    restart: on-failure
    build:
      context: .
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/
      - /usr/src/node_modules
      - /usr/src/.next
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/src
        - action: sync
          path: ./public
          target: /usr/src/public
        - action: rebuild
          path: package.json
          target: /usr/src/package.json
        - action: rebuild
          path: pnpm-lock.yaml
          target: /usr/src/pnpm-lock.yaml
