services:
  front:
    container_name: front
    build:
      context: .
    restart: on-failure
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/
      - /usr/src/node_modules
      - /usr/src/.next
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
